name: Printing and report checks
on:
  pull_request:
  push:
    branches: [main, codex/owner-report-printing]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node node_modules/next/dist/bin/next build --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
