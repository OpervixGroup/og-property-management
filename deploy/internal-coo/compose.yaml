# Preparation template only; this file does not provision a host or select/download a model.
# Operate on the same private Linux host as the application, or behind a private TLS gateway.
services:
  coo-model:
    image: ${OG_INTERNAL_MODEL_IMAGE:?Set a reviewed locally available Ollama image pinned by digest}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${OG_INTERNAL_MODELS_DIR:?Set a reviewed preloaded local model directory}:/models:ro
    networks:
      - inference
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 12g
    cpus: 4
    logging:
      driver: "none"
networks:
  inference:
    internal: true
